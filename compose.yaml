services:
  integration-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      IntegrationSecurity__ApiKey: ${INTEGRATION_API_KEY:?Set INTEGRATION_API_KEY before starting}
    ports:
      - "8080:8080"
    volumes:
      - integration-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --fail http://localhost:8080/health || exit 1"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  integration-data:
