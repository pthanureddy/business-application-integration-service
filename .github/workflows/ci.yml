name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BusinessApplicationIntegration.sln

      - name: Build
        run: dotnet build BusinessApplicationIntegration.sln --configuration Release --no-restore

      - name: Test with coverage
        run: >-
          dotnet test BusinessApplicationIntegration.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml

      - name: Build Docker image
        run: docker build --tag business-application-integration-service:${{ github.sha }} .
