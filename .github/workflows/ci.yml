name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate-infrastructure:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile application Azure Bicep template
        run: az bicep build --file deploy/azure/main.bicep --outfile main.json

      - name: Compile integration-platform Azure Bicep template
        run: >-
          az bicep build
          --file deploy/azure/integration-platform.bicep
          --outfile integration-platform.json

  validate-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@1.34.5 lint --extends=minimal contracts/openapi.yaml

      - name: Validate AsyncAPI contract
        run: npx --yes @asyncapi/cli@3.4.0 validate contracts/integration-events.asyncapi.yaml

  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BusinessApplicationIntegration.sln

      - name: Audit NuGet dependencies
        run: |
          dotnet list BusinessApplicationIntegration.sln package --vulnerable --include-transitive --format json > vulnerabilities.json
          jq -e '[.projects[] | (.frameworks // [])[] | ((.topLevelPackages // []) + (.transitivePackages // []))[]] | length == 0' vulnerabilities.json

      - name: Build
        run: dotnet build BusinessApplicationIntegration.sln --configuration Release --no-restore

      - name: Test with coverage
        run: >-
          dotnet test BusinessApplicationIntegration.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml

      - name: Build Docker image
        run: docker build --tag business-application-integration-service:${{ github.sha }} .
